# Typecheck, web build and the whole test suite on Linux and macOS. No secrets are used.
# Shell commands run in-process (TDRIVE_SHELL=inprocess): the isolated shell executor is exercised by
# tests/worker.test.ts and by scripts/docker-test.sh. The worker sandbox is required, never skipped: bwrap on Linux,
# sandbox-exec on macOS (TDRIVE_EXPECT_ISOLATION makes a missing one fail the suite), and document extraction runs in
# it as in production. macOS-only tests (installer dry run, vendored pdftotext) skip themselves on Linux with
# test.skipIf(process.platform !== 'darwin').
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            isolation: bwrap
          - os: macos-15
            isolation: sandbox-exec
    env:
      TDRIVE_SHELL: inprocess
      TDRIVE_EXPECT_ISOLATION: ${{ matrix.isolation }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep poppler-utils bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor: bwrap then gets a namespace without
          # capabilities and fails ("loopback: Failed RTM_NEWADDR"). Lift it for this runner; the tests need the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if ! bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL --ro-bind / / --proc /proc --dev /dev true; then
            echo "::error::bwrap cannot create the worker sandbox on this runner; the suite needs it (TDRIVE_EXPECT_ISOLATION=bwrap)"
            exit 1
          fi

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep poppler

      - run: bun install --frozen-lockfile
      - name: Typecheck (server and web)
        run: bun run typecheck
      - name: Build web app
        run: bun run build:web
      - name: Tests
        run: bun run test
