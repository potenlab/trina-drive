<html lang="en">

  h1 span { display: block; background: linear-gradient(100deg, #ff6a33, #ff8a4c 55%, #ffab73); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 26px 0 0; font-size: 24px; color: #cfc6bb; letter-spacing: -.01em; }
  code { display: inline-block; margin-top: 30px; padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.45); font-family: "Geist Mono", monospace; font-size: 20px; color: #ece6dc; }
