<!doctype html>
<!-- Source of public/og.png (1200×630). Rendered with headless Chromium, e.g.:
     bunx playwright screenshot --viewport-size=1200,630 "file://$PWD/scripts/og.html" public/og.png
     then compressed (sharp / pngquant). Uses the site's own font and key visual. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url("../public/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../public/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #08090b; }
  body { position: relative; font-family: Geist, sans-serif; color: #f2f3f5; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; background: url("../public/img/hero-dark-2400.webp") center / cover no-repeat; opacity: .9; }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 50%, rgba(8,9,11,.55), rgba(8,9,11,.15) 80%), linear-gradient(rgba(8,9,11,0), rgba(8,9,11,.7)); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 650; letter-spacing: -.03em; }
  .brand svg { width: 40px; height: 40px; }
  h1 { margin: 34px 0 0; font-size: 66px; line-height: 1.04; letter-spacing: -.048em; font-weight: 600; }
  h1 span { display: block; background: linear-gradient(100deg, #6ee7b7, #3ddc97 40%, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 26px 0 0; font-size: 24px; color: #c3c9d1; letter-spacing: -.01em; }
  code { display: inline-block; margin-top: 30px; padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.45); font-family: "Geist Mono", monospace; font-size: 20px; color: #e6e8eb; }
  code b { color: #3ddc97; font-weight: 400; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="8" fill="#f2f3f5"/><path d="M8 11.5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2V21a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z" fill="none" stroke="#0a0b0d" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16" cy="16.5" r="1.9" fill="#0a7a53"/><path d="M16 18v2.4" stroke="#0a7a53" stroke-width="1.8" stroke-linecap="round"/></svg>
      Trina Drive
    </div>
    <h1>Your company folders,<span>as your team’s AI knowledge base.</span></h1>
    <p>No ontology, no RAG pipeline, no uploads. For teams of 5 to 20.</p>
    <code><b>$</b> grep -ri "termination fee" /contracts</code>
  </div>
</body>
</html>
