# Local Trina Cloud (cloud/dev/up.sh): the control plane, Caddy and the mail relay. Team containers are not in this
# file: the control plane creates them (one per team, each on its own network with a fixed /28) through the mounted
# Docker socket — the local driver.
# Variables come from cloud/dev/.state/dev.env (written by up.sh).
name: tdcloud-dev

services:
  control:
    image: tdcloud-control:dev
    container_name: tdc-control
    restart: unless-stopped
    environment:
      TDCLOUD_STATE_DIR: ${TDCLOUD_STATE_DIR}
      TDCLOUD_DOMAIN: ${TDCLOUD_DOMAIN}
      TDCLOUD_PUBLIC_PORT: ${TDCLOUD_PUBLIC_PORT}
      TDCLOUD_LISTEN_HOST: 0.0.0.0
      TDCLOUD_DRIVER: local
      TDCLOUD_IMAGE: ${TDCLOUD_IMAGE}
      TDCLOUD_HELPER_IMAGE: tdcloud-control:dev
      TDCLOUD_SECCOMP: /etc/tdcloud/seccomp-bwrap.json
      TDCLOUD_APPARMOR: ${TDCLOUD_APPARMOR}
      TDCLOUD_CADDY_CONTAINER: tdc-caddy
      TDCLOUD_CADDY_ASK_KEY: ${TDCLOUD_CADDY_ASK_KEY}
      TDCLOUD_TRUSTED_PROXIES: 10.250.250.10
      # the host scaler on simulated hosts (drivers/local.ts LocalPool): one team per host, so the end-to-end test
      # scales out from 0 for each team, reaches the limit, and scales an emptied host in after a short grace
      TDCLOUD_AUTOSCALE: "1"
      TDCLOUD_MAX_TEAMS_PER_HOST: "1"
      TDCLOUD_MAX_HOSTS: "3"
      TDCLOUD_LOCAL_HOST_BOOT: 3s
      TDCLOUD_EMPTY_HOST_GRACE: 20s
      TDCLOUD_SCALER_EVERY: 5s
      # the Free plan with short timers (README "Free plan"): one free team at most (the second confirmed sign-up waits),
      # free teams may launch the last host here, activity read every 3 s, warned after 60 s idle, paused after 100 s (the SSO sign-in steps, authenticator codes
      # included, must fit before the pause)
      TDCLOUD_MAX_FREE_TEAMS: "1"
      TDCLOUD_FREE_RESERVE_HOSTS: "0"
      TDCLOUD_FREE_ACTIVITY_EVERY: 3s
      TDCLOUD_FREE_IDLE_WARN: 60s
      TDCLOUD_FREE_IDLE_PAUSE: 100s
      TDCLOUD_FREE_WAKE_GRACE: 5m
      TDCLOUD_OPS_EMAIL: ops@trina.test
      TDCLOUD_MAIL_FROM: Trina Cloud (dev) <cloud@trina.test>
      # team instances mail through the relay below (TDRIVE_MAILER=ses → http://<team gateway>:8025), as on AWS
      TDCLOUD_TEAM_MAIL_FROM: ${TDCLOUD_TEAM_MAIL_FROM}
      PADDLE_ENV: sandbox
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET}
      PADDLE_PRICE_TEAM_MONTHLY: pri_dev_team_monthly
      PADDLE_PRICE_TEAM_YEARLY: pri_dev_team_yearly
      PADDLE_PRICE_BUSINESS_MONTHLY: pri_dev_business_monthly
      PADDLE_PRICE_BUSINESS_YEARLY: pri_dev_business_yearly
    volumes:
      # the local driver runs docker commands on this engine (root-equivalent: dev only, see the Dockerfile's dev target)
      - /var/run/docker.sock:/var/run/docker.sock
      # same absolute path inside and outside, because team backup staging is a bind mount made by this engine
      - ${TDCLOUD_STATE_DIR}:${TDCLOUD_STATE_DIR}
      - ../../docker/seccomp-bwrap.json:/etc/tdcloud/seccomp-bwrap.json:ro
    networks:
      control:
        ipv4_address: 10.250.250.11

  caddy:
    image: tdcloud-caddy:dev
    container_name: tdc-caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    environment:
      TDCLOUD_DOMAIN: ${TDCLOUD_DOMAIN}
      TDCLOUD_SLUG_LABEL: ${TDCLOUD_SLUG_LABEL}
      TDCLOUD_ASK_URL: http://tdc-control:8790/internal/caddy/ask?key=${TDCLOUD_CADDY_ASK_KEY}
    ports:
      - "127.0.0.1:${TDCLOUD_PUBLIC_PORT}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks:
      control:
        ipv4_address: 10.250.250.10

  # The mail relay, as on an AWS team host (cloud/host/bootstrap.sh): on the host network of the Docker engine (here the
  # engine's VM), so every team reaches it at its own network's gateway and nothing else. Instead of Resend it appends each
  # message to .state/team-mail.log — the dev mail sink the end-to-end test reads.
  mail:
    image: tdcloud-control:dev
    container_name: tdc-mail
    restart: unless-stopped
    command: ["mail-relay"]
    network_mode: host
    environment:
      TDCLOUD_TEAM_MAIL_FROM: ${TDCLOUD_TEAM_MAIL_FROM}
      TDCLOUD_MAIL_UPSTREAM: outbox:${TDCLOUD_STATE_DIR}/team-mail.log
      TDCLOUD_MAIL_RELAY_LISTEN: 0.0.0.0:8025
    volumes:
      - ${TDCLOUD_STATE_DIR}:${TDCLOUD_STATE_DIR}
    read_only: true
    security_opt: ["no-new-privileges:true"]

networks:
  control:
    name: tdc-control
    ipam:
      config:
        - subnet: 10.250.250.0/24

volumes:
  caddy-data:
  caddy-config:
